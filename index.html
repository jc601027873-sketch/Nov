<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>互动小说</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; background:#0a0a0a; color:#f0f0f0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.container { max-width: 520px; margin: 0 auto; padding: 16px; min-height: 100vh; }
h1 { font-size: 1.5rem; text-align: center; margin: 16px 0 24px; font-weight: 600; }
.card { background: #161616; border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a2a; }
.story { white-space: pre-wrap; word-break: break-word; line-height: 1.8; font-size: 1.05rem; min-height: 40vh; }
.grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 12px 0; }
.btn { padding: 16px; background: #1e1e1e; border: 1px solid #333; border-radius: 16px; color: #eee; font-size: 0.95rem; text-align: left; cursor: pointer; }
.btn:active { transform: scale(0.97); }
.btn.selected { background: #1e3a5f; border-color: #3b82f6; }
.btn.primary { background: #2563eb; border-color: #2563eb; text-align: center; font-weight: 600; padding: 16px; }
.choices .btn { margin: 10px 0; width: 100%; padding: 18px; font-size: 1rem; line-height: 1.5; }
input, textarea { width: 100%; padding: 16px; margin: 10px 0; background: #1e1e1e; border: 1px solid #333; border-radius: 14px; color: #eee; font-size: 16px; }
textarea { min-height: 80px; resize: vertical; }
.hidden { display: none !important; }
.small { font-size: 0.8rem; color: #888; margin: 6px 0; display: block; }
#loading { text-align: center; padding: 30px; color: #666; }
.status { font-size: 0.85rem; color: #4ade80; margin-top: 10px; text-align: center; }
.status.error { color: #f87171; }
.step-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
.world-btn strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>互动小说</h1>

  <div id="stepApi">
    <div class="card">
      <div class="step-title">API 验证</div>
      <input type="password" id="apiKey" placeholder="Grok API Key">
      <input type="text" id="model" value="grok-4.7" placeholder="模型名称">
      <button class="btn primary" onclick="verifyAndNext()">验证并进入</button>
      <div id="apiStatus" class="status"></div>
    </div>
  </div>

  <div id="stepWorld" class="hidden">
    <div class="card">
      <div class="step-title">选择世界观</div>
      <div class="grid" id="worldGrid"></div>
    </div>
  </div>

  <div id="stepChar" class="hidden">
    <div class="card">
      <div class="step-title">选择你的角色</div>
      <div class="small">同性别角色仅作剧情推动，异性可攻略</div>
      <div class="grid" id="playerGrid"></div>
      <textarea id="customNote" placeholder="额外要求（可选）"></textarea>
      <button class="btn primary" onclick="startStory()">开始故事</button>
    </div>
  </div>

  <div id="play" class="hidden">
    <div class="card story" id="storyText"></div>
    <div class="choices" id="choices"></div>
    <div id="loading" class="hidden">生成中...</div>
    <button class="btn" onclick="restart()">重新开始</button>
  </div>
</div>

let messages = [];
let currentWorld = null;
let selectedPlayer = null;

function init() {
  const saved = localStorage.getItem("grok_key");
  if (saved) document.getElementById("apiKey").value = saved;
}

async function verifyAndNext() {
  const key = document.getElementById("apiKey").value.trim();
  const model = document.getElementById("model").value.trim() || "grok-4.7";
  const status = document.getElementById("apiStatus");
  if (!key) { status.textContent = "请填写 API Key"; status.className = "status error"; return; }
  status.textContent = "验证中...";
  status.className = "status";
  const ok = await verifyAPI(key, model);
  if (ok) {
    localStorage.setItem("grok_key", key);
    status.textContent = "验证成功";
    document.getElementById("stepApi").classList.add("hidden");
    document.getElementById("stepWorld").classList.remove("hidden");
    renderWorlds();
  } else {
    status.textContent = "验证失败，请检查 Key 或模型";
    status.className = "status error";
  }
}

async function verifyAPI(key, model) {
  try {
    const res = await fetch("https://nov.jc601027873.workers.dev/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: [{role:"user", content:"hi"}], max_tokens: 5 })
    });
    return res.ok;
  } catch { return false; }
}

function renderWorlds() {
  const grid = document.getElementById("worldGrid");
  grid.innerHTML = "";
  worldviews.forEach((w, i) => {
    const btn = document.createElement("button");
    btn.className = "btn world-btn";
    btn.innerHTML = `<strong>${w.name}</strong><span class="small">${w.desc}</span>`;
    btn.onclick = () => selectWorld(i);
    grid.appendChild(btn);
  });
}

function selectWorld(idx) {
  currentWorld = worldviews[idx];
  document.getElementById("stepWorld").classList.add("hidden");
  document.getElementById("stepChar").classList.remove("hidden");
  renderPlayers();
}

function renderPlayers() {
  const grid = document.getElementById("playerGrid");
  grid.innerHTML = "";
  currentWorld.players.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerHTML = `<strong>${p.name}</strong><span class="small">${p.gender} · ${p.age}岁 · ${p.appearance}</span>`;
    btn.onclick = () => {
      document.querySelectorAll("#playerGrid .btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedPlayer = p;
    };
    grid.appendChild(btn);
  });
}

async function startStory() {
  if (!selectedPlayer) { alert("请选择角色"); return; }
  const key = document.getElementById("apiKey").value.trim();
  const model = document.getElementById("model").value.trim() || "grok-4.7";
  const note = document.getElementById("customNote").value.trim();

  const allOthers = [...currentWorld.players.filter(p => p.name !== selectedPlayer.name), ...currentWorld.npcs];
  const sameGender = allOthers.filter(c => c.gender === selectedPlayer.gender);
  const opposite = allOthers.filter(c => c.gender !== selectedPlayer.gender);

  let sys = `你是一位顶级情色文学作家与互动小说设计师。每一节正文必须800字以上，文笔细腻、感官强烈、性爱描写具体精彩（详细描写身体接触、快感、心理变化）。
需要选择时，必须在最后以以下格式给出选项（2-4个）：

选项：
A. 选项内容
B. 选项内容
C. 选项内容
D. 选项内容

所有角色必须是成年人。

【世界观】${currentWorld.name}：${currentWorld.desc}

【玩家角色】${selectedPlayer.name}（${selectedPlayer.gender}，${selectedPlayer.age}岁）
外貌：${selectedPlayer.appearance}
性格：${selectedPlayer.personality}
背景：${selectedPlayer.background}

【重要规则】
- 同性别角色只作为剧情推动者，不进行恋爱或性相关互动。
- 异性角色可以被攻略，可以进行亲密互动。

同性别角色（仅剧情）：${sameGender.map(c => c.name).join("、")}
可攻略异性：${opposite.map(c => c.name).join("、")}
`;
  if (note) sys += `\n【额外要求】${note}\n`;

  messages = [{role:"system", content:sys}];

  document.getElementById("stepChar").classList.add("hidden");
  document.getElementById("play").classList.remove("hidden");
  document.getElementById("storyText").textContent = "";
  document.getElementById("choices").innerHTML = "";
  await generate();
}

async function generate() {
  const key = document.getElementById("apiKey").value.trim();
  const model = document.getElementById("model").value.trim() || "grok-4.7";
  document.getElementById("loading").classList.remove("hidden");
  try {
    const res = await fetch("https://nov.jc601027873.workers.dev/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages, temperature: 0.85, max_tokens: 2500 })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || "生成失败";
    messages.push({role:"assistant", content:text});
    parseAndShow(text);
  } catch (e) {
    document.getElementById("storyText").textContent = "API 错误：\n" + e.message;
  }
  document.getElementById("loading").classList.add("hidden");
}

function parseAndShow(text) {
  const idx = text.indexOf("选项：");
  let body = text;
  let opts = [];
  if (idx !== -1) {
    body = text.substring(0, idx).trim();
    const part = text.substring(idx + 3);
    part.split("\n").forEach(line => {
      line = line.trim();
      if (/^[ABCD]\./.test(line)) opts.push({letter: line[0], text: line.substring(2).trim()});
    });
  }
  document.getElementById("storyText").textContent = body;
  const box = document.getElementById("choices");
  box.innerHTML = "";
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = o.letter + ". " + o.text;
    btn.onclick = () => choose(o.text);
    box.appendChild(btn);
  });
}

async function choose(text) {
  messages.push({role:"user", content:"我选择：" + text});
  document.getElementById("choices").innerHTML = "";
  await generate();
}

function restart() {
  messages = [];
  currentWorld = null;
  selectedPlayer = null;
  document.getElementById("play").classList.add("hidden");
  document.getElementById("stepApi").classList.remove("hidden");
  document.getElementById("apiStatus").textContent = "";
}

init();
</script>
</body>
